language: en_US
rendering:
  # vanilla, resource-pack, mixed. Restart to apply a mode change.
  mode: vanilla
  resource-pack:
    # URL of the independent tabletop ZIP shipped with this plugin version.
    # Pack checksum and request identity are managed by the plugin.
    url: ''
max-rooms: 12
reconnect-seconds: 120
idle-room-minutes: 30
turn-seconds: 60
sounds:
  enabled: true
  # Multiplier for the quiet native tabletop cues, from 0.0 to 1.0.
  volume: 1.0
