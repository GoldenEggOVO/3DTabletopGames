language: en_US
rendering:
  # auto selects mixed with enabled CraftEngine, otherwise vanilla. Restart to apply.
  # Optional overrides: vanilla, mixed, resource-pack.
  mode: auto
  resource-pack:
    # local: editable server folder; external: matching ZIP at the URL below.
    source: local
    url: ''
    local:
      bind-address: '0.0.0.0'
      port: 8137
      # Optional public HTTP(S) base URL, e.g. https://games.example.org.
      # Empty uses the hostname players connect to and the port above.
      public-url: ''
max-rooms: 12
reconnect-seconds: 120
idle-room-minutes: 30
turn-seconds: 60
sounds:
  enabled: true
  # Multiplier for the quiet native tabletop cues, from 0.0 to 1.0.
  volume: 1.0
