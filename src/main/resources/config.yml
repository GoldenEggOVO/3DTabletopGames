language: en
rendering:
  # vanilla, resource-pack, mixed. Restart to apply a mode change.
  mode: vanilla
  resource-pack:
    # Independent tabletop ZIP URL and its SHA-1 (40 hexadecimal characters).
    url: ''
    sha1: ''
    uuid: 40ae45a0-4d81-4c07-8e68-807e85168a09
max-rooms: 12
reconnect-seconds: 120
idle-room-minutes: 30
turn-seconds: 60
sounds:
  enabled: true
  # Multiplier for the quiet native tabletop cues, from 0.0 to 1.0.
  volume: 1.0
