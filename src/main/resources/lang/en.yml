  '121孔六角星中国跳棋，支持2/3/4/6人；相邻步行或连续短跳，把全部棋子送入对面营地获胜。': 'Chinese Checkers on a 121-hole star for 2, 3, 4, or 6 players. Step to adjacent holes or make chained short jumps. Move all pieces into the opposite camp to win.'
  '12轮已结束': 'All 12 rounds completed'
  '12轮快艇变体：每回合最多3掷，可保留骰子；小顺15、大顺30、快艇50；上半区满63加35分，无额外快艇奖励': 'Yacht variant with 12 rounds and up to three rolls per turn. Hold dice; small straight scores 15, large straight 30, Yacht 50. Score a 35-point upper bonus at 63; no extra Yacht bonus.'
  '13路 · 进阶对弈': '13×13 · Intermediate'
  '15×15 自由五子棋；连五或以上获胜；无禁手': '15×15 freestyle Gomoku; make five or more in a row to win; no forbidden moves'
  '15×15自由五子棋，先连成五子或更多获胜；不设黑方禁手。': '15×15 freestyle Gomoku. First to connect five or more stones wins. Black has no forbidden moves.'
  '19路 · 完整棋盘': '19×19 · Full board'
  '2–4人快艇骰子，每人12轮，每回合最多掷3次，可保留任意骰子；每种计分项只填一次，可主动填零。小顺15、大顺30、快艇50，上半区达到63分额外加35分；没有额外快艇奖励。点击桌上骰子可保留，操作菜单填写计分表。': 'Yacht dice for 2–4 players. Each player has 12 rounds and up to three rolls per turn. Hold any dice, score each category once, and optionally score zero. Small straight is 15, large straight 30, Yacht 50, and reaching 63 in the upper section adds 35. There is no extra Yacht bonus. Click dice to hold them and use the menu to fill the score sheet.'
  '50 回合无吃子且无兵移动': '50 moves without a capture or pawn move'
  '7列6行竖直四子棋；点击列后重力落子，横、竖、双斜向四连获胜；满盘无赢家则和局。': 'Connect Four on a vertical 7×6 board. Click a column to drop a piece. Four in a row horizontally, vertically, or diagonally wins; a full board without a winner is a draw.'
  '7列6行竖直棋盘；点击列后棋子落到底部；横、竖或斜向四连获胜': 'Vertical 7×6 board; click a column to drop a piece to the lowest free slot; connect four horizontally, vertically, or diagonally to win'
  '8×8 英美式西洋跳棋：有吃必吃，兵向前走及吃子，短王双向，连吃不可中断；升王立即结束该回合。三次重复或双方各40步无吃子且无兵移动自动和棋': '8×8 English draughts: captures are mandatory; men move and capture forward, kings move both ways, and capture chains must continue. Crowning ends the turn. Threefold repetition or 40 moves each without a capture or man move is an automatic draw.'
  '8×8 英美式西洋跳棋：黑先，兵只向前走及吃子，王可双向短跳；有吃必吃，连吃必须用同一棋子，升王立即结束该回合。三次同局面或双方各40步无吃子、无兵移动自动和棋。': '8×8 English draughts: Black moves first. Men move and capture forward; kings can make short jumps both ways. Captures and continued captures with the same piece are mandatory. Crowning ends the turn. Threefold repetition or 40 moves each without a capture or man move is an automatic draw.'
  '8×8 黑白棋，黑先；无子可翻自动停手，双方无合法落点时数子': '8×8 Reversi; Black first. Pass automatically when no discs can be flipped; count discs when neither side has a legal move'
  '8×8 黑白棋：黑先，横竖斜线夹住对方棋子并全部翻面；无合法落点自动停手，双方都无法落子时，多子者获胜。': '8×8 Reversi: Black moves first. Bracket enemy discs horizontally, vertically, or diagonally to flip them. A player without a legal move passes automatically. When neither player can move, the player with more discs wins.'
  '9路 · 快速对弈': '9×9 · Quick game'
  '9路适合短局，13路适中，19路为完整大棋盘；均采用面积计分、白贴7.5目。': 'Choose 9×9 for a short game, 13×13 for a medium game, or 19×19 for a full game. All use area scoring with 7.5 komi for White.'
  'Tabletop3D 已启用。': '3dtabletop enabled.'
  '\n\n§7回合超时由基础陪练代走；离线/离开世界保留120秒。关闭菜单不退房。': '\n\n§7Basic bots play when a turn times out. Seats are held for 120 seconds after disconnecting or leaving the world. Closing the menu does not leave the room.'
