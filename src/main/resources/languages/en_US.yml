"rules.yacht-variant-with-12-rounds-and-up-to-three-rolls-per-.020a42": "Yacht variant with 12 rounds and up to three rolls per turn. Hold dice; small straight scores 15, large straight 30, Yacht 50. Score a 35-point upper bonus at 63; no extra Yacht bonus."
"rules.13-13-intermediate.290a0f": "13×13 · Intermediate"
"rules.15-15-freestyle-gomoku-make-five-or-more-in-a-row-to-wi.027cbd": "15×15 freestyle Gomoku; make five or more in a row to win; no forbidden moves"
"rules.15-15-freestyle-gomoku-first-to-connect-five-or-more-st.fccc58": "15×15 freestyle Gomoku. First to connect five or more stones wins. Black has no forbidden moves."
"rules.19-19-full-board.77b8c5": "19×19 · Full board"
"rules.yacht-dice-for-2-4-players-each-player-has-12-rounds-an.7a1b08": "Yacht dice for 2–4 players. Each player has 12 rounds and up to three rolls per turn. Hold any dice, score each category once, and optionally score zero. Small straight is 15, large straight 30, Yacht 50, and reaching 63 in the upper section adds 35. There is no extra Yacht bonus. Click dice to hold them and use the menu to fill the score sheet."
"rules.50-moves-without-a-capture-or-pawn-move.e822b9": "50 moves without a capture or pawn move"
"rules.connect-four-on-a-vertical-7-6-board-click-a-column-to-.17a4e1": "Connect Four on a vertical 7×6 board. Click a column to drop a piece. Four in a row horizontally, vertically, or diagonally wins; a full board without a winner is a draw."
"rules.vertical-7-6-board-click-a-column-to-drop-a-piece-to-th.a6c6a0": "Vertical 7×6 board; click a column to drop a piece to the lowest free slot; connect four horizontally, vertically, or diagonally to win"
"rules.8-8-english-draughts-captures-are-mandatory-men-move-an.799222": "8×8 English draughts: captures are mandatory; men move and capture forward, kings move both ways, and capture chains must continue. Crowning ends the turn. Threefold repetition or 40 moves each without a capture or man move is an automatic draw."
"rules.8-8-english-draughts-black-moves-first-men-move-and-cap.6e53c4": "8×8 English draughts: Black moves first. Men move and capture forward; kings can make short jumps both ways. Captures and continued captures with the same piece are mandatory. Crowning ends the turn. Threefold repetition or 40 moves each without a capture or man move is an automatic draw."
"rules.8-8-reversi-black-first-pass-automatically-when-no-disc.d23605": "8×8 Reversi; Black first. Pass automatically when no discs can be flipped; count discs when neither side has a legal move"
"rules.8-8-reversi-black-moves-first-bracket-enemy-discs-horiz.ff2228": "8×8 Reversi: Black moves first. Bracket enemy discs horizontally, vertically, or diagonally to flip them. A player without a legal move passes automatically. When neither player can move, the player with more discs wins."
"rules.9-9-quick-game.685e0e": "9×9 · Quick game"
"rules.choose-9-9-for-a-short-game-13-13-for-a-medium-game-or-.d8655b": "Choose 9×9 for a short game, 13×13 for a medium game, or 19×19 for a full game. All use area scoring with 7.5 komi for White."
