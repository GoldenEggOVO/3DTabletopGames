"rules.ludo": "Ludo for 2–4 players. Four pawns each; pawn 1 starts on the track. Six deploys a pawn or moves it six spaces and grants another roll. Land on rivals to send them to their yard. Captured pawns need six to return. No blocking, color jumps, rebound or triple-six penalty. Finish all four pawns with exact rolls to win."
