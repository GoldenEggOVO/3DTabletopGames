"rules.gomoku": "15×15 freestyle Gomoku. First to connect five or more stones wins. Black has no forbidden moves."
"rules.xiangqi": "Xiangqi: facing generals, blocked horse legs and elephant eyes, river and palace limits, and checks are enforced. Checkmate or stalemate loses. See the rules panel for repetition and perpetual check."
"rules.chess": "Chess: castling, en passant, four promotion choices, checkmate, stalemate, repetition, and the 50-move draw are supported."
"rules.aeroplane": "Aeroplane Chess: roll six to launch, jump or fly on matching colors, and stack planes as blockades. A third consecutive six sends unfinished planes home. This server variant applies."
"rules.checkers": "Chinese Checkers on a 121-hole star for 2, 3, 4, or 6 players. Step to adjacent holes or make chained short jumps. Move all pieces into the opposite camp to win."
"rules.draughts": "8×8 English draughts: Black moves first. Men move and capture forward; kings can make short jumps both ways. Captures and continued captures with the same piece are mandatory. Crowning ends the turn. Threefold repetition or 40 moves each without a capture or man move is an automatic draw."
"rules.reversi": "8×8 Reversi: Black moves first. Bracket enemy discs horizontally, vertically, or diagonally to flip them. A player without a legal move passes automatically. When neither player can move, the player with more discs wins."
"rules.go": "Go supports 9×9, 13×13, and 19×19 boards. Area scoring with 7.5 komi for White, no suicide, and positional superko. After two passes, mark dead groups and have both players confirm the score; either player may resume play to resolve a dispute. Bots make basic moves only."
"rules.yacht": "Yacht dice for 2–4 players. Each player has 12 rounds and up to three rolls per turn. Hold any dice, score each category once, and optionally score zero. Small straight is 15, large straight 30, Yacht 50, and reaching 63 in the upper section adds 35. There is no extra Yacht bonus. Click dice to hold them and use the menu to fill the score sheet."
"rules.connectfour": "Connect Four on a vertical 7×6 board. Click a column to drop a piece. Four in a row horizontally, vertically, or diagonally wins; a full board without a winner is a draw."
"rules.default": "Choose a game to view its rules."
"rules.footer": "<gray>Basic bots play when a turn times out. Seats are held for {seconds} seconds after disconnecting or leaving the world. Closing the menu does not leave the room.</gray>"
