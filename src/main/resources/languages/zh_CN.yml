"rules.doudizhu": "三人叫分决定地主，出相同类型且更大的牌组；两家不出后重新领出。地主对抗两名农民，炸弹和春天翻倍。"
"rules.liars-bar": "按桌面指定的 A、K 或 Q 声明暗出 1–3 张牌，王为万能牌。只能质疑上一组；说谎者或质疑诚实出牌的人接受轮盘判定，仅影响本局淘汰。"
"rules.texas-holdem": "2–6 人各持 1000 本局筹码，盲注 5/10。两张底牌与五张公共牌组成最佳五张；可弃牌、过牌、跟注、加注、全押。边池分别结算，直到一人拥有全部筹码，不使用经济余额。"
