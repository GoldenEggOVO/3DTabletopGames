# rules
"rules.aeroplane": "飞行棋：6点起飞，同色跳跃/飞越，叠机壁垒；连续第三个6使未完成飞机回营。以此服务器变体为准。"
"rules.checkers": "121孔六角星中国跳棋，支持2/3/4/6人；相邻步行或连续短跳，把全部棋子送入对面营地获胜。"
"rules.chess": "国际象棋：王车易位、吃过路兵、四种升变、将死与逼和，含重复与50回合和棋判定。"
"rules.color-eight": "Color Eight: 2–5 players, five starting cards, match color or rank. Wild Eight chooses color; Draw One affects every opponent; Skip misses the next player; Reverse changes direction (Skip in two players); Swap trades remaining hands with the next player and retains the active color and rank. You may draw once and then play any legal card or pass. First empty hand wins before resolving its last card effect. No stacking or declaration penalty."
"rules.connectfour": "7列6行竖直四子棋；点击列后重力落子，横、竖、双斜向四连获胜；满盘无赢家则和局。"
"rules.default": "选择棋类后查看规则。"
"rules.draughts": "8×8 英美式西洋跳棋：黑先，兵只向前走及吃子，王可双向短跳；有吃必吃，连吃必须用同一棋子，升王立即结束该回合。三次同局面或双方各40步无吃子、无兵移动自动和棋。"
"rules.footer": "<gray>回合超时由基础陪练接手；断线或离开世界后保留座位 {seconds} 秒。关闭菜单不会退出房间。</gray>"
"rules.go": "围棋有9/13/19路。面积计分、白贴7.5目，禁自杀和全局同形。双方连续停手后进入死子协商：点击棋块切换标记，双方确认后结算；任何一方都可恢复行棋解决争议。陪练只会基础落子，不具备职业判断。"
"rules.gomoku": "15×15自由五子棋，先连成五子或更多获胜；不设黑方禁手。"
"rules.ludo": "2–4 人，每人 4 枚棋子；开局首枚自动出营。6 点可以出营或前进，并再掷一次。落到对手位置将其送回营地，被送回的棋子需要 6 点重新出营。不阻挡通行、无同色跳跃、无回弹、无连续三个 6 惩罚。精确到达终点，四枚全部完成者获胜。"
"rules.mahjong": "Choose regional rules before creating a four-player table. Your concealed tiles are private; opponents see their backs. Click your tiles or use the hand menu to discard, call or win. Points belong only to this match and are not server currency. Regional scoring follows the documented 3D Tabletop Games house rules."
"rules.reversi": "8×8 黑白棋：黑先，横竖斜线夹住对方棋子并全部翻面；无合法落点自动停手，双方都无法落子时，多子者获胜。"
"rules.title": "{game}规则"
"rules.xiangqi": "中国象棋：将帅照面、马腿、象眼、象不过河、九宫及自将过滤。将死或困毙判负；重复和长将规则以规则面板标注为准。"
"rules.yacht": "2–4人快艇骰子，每人12轮，每回合最多掷3次，可保留任意骰子；每种计分项只填一次，可主动填零。小顺15、大顺30、快艇50，上半区达到63分额外加35分；没有额外快艇奖励。点击桌上骰子可保留，操作菜单填写计分表。"

