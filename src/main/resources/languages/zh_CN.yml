# rules
"rules.checkers": "121孔六角星中国跳棋，支持2/3/4/6人；相邻步行或连续短跳，把全部棋子送入对面营地获胜。"
"rules.chess": "国际象棋：王车易位、吃过路兵、四种升变、将死与逼和，含重复与50回合和棋判定。"
"rules.color-eight": "彩八：2–5 人，开局各持五张牌，按颜色或点数接牌。万能八可选颜色；摸一张让所有对手各摸一张；跳过让下家停一回合；反转改变方向（两人局相当于跳过）；交换牌与下家交换剩余手牌，并保持当前颜色和点数。每回合可摸一次牌，再打出任意合法牌或跳过。先出完手牌者获胜，最后一张牌的效果不再结算。不能叠加摸牌，不设声明处罚。"
"rules.connectfour": "7列6行竖直四子棋；点击列后重力落子，横、竖、双斜向四连获胜；满盘无赢家则和局。"
"rules.default": "选择棋类后查看规则。"
"rules.draughts": "8×8 英美式西洋跳棋：黑先，兵只向前走及吃子，王可双向短跳；有吃必吃，连吃必须用同一棋子，升王立即结束该回合。三次同局面或双方各40步无吃子、无兵移动自动和棋。"
"rules.footer": "<gray>回合超时由基础陪练接手；断线或离开世界后保留座位 {seconds} 秒。关闭菜单不会退出房间。</gray>"
"rules.go": "围棋有9/13/19路。面积计分、白贴7.5目，禁自杀和全局同形。双方连续停手后进入死子协商：点击棋块切换标记，双方确认后结算；任何一方都可恢复行棋解决争议。陪练只会基础落子，不具备职业判断。"
"rules.gomoku": "15×15自由五子棋，先连成五子或更多获胜；不设黑方禁手。"
"rules.ludo": "2–4 人，每人 4 枚棋子；开局首枚自动出营。6 点可以出营或前进，并再掷一次。落到对手位置将其送回营地，被送回的棋子需要 6 点重新出营。不阻挡通行、无同色跳跃、无回弹、无连续三个 6 惩罚。精确到达终点，四枚全部完成者获胜。"
"rules.mahjong": "创建四人牌桌前选择地区规则。只有你能看到自己的暗牌，对手看到牌背。点击手牌或打开手牌菜单可打牌、鸣牌或和牌。分数仅属于本场对局，不是服务器货币。各地区计分采用文档列明的3D桌游房规。"
"rules.reversi": "8×8 黑白棋：黑先，横竖斜线夹住对方棋子并全部翻面；无合法落点自动停手，双方都无法落子时，多子者获胜。"
"rules.title": "{game}规则"
"rules.xiangqi": "中国象棋：将帅照面、马腿、象眼、象不过河、九宫及自将过滤。将死或困毙判负；重复和长将规则以规则面板标注为准。"
"rules.yacht": "2–4人快艇骰子，每人12轮，每回合最多掷3次，可保留任意骰子；每种计分项只填一次，可主动填零。小顺15、大顺30、快艇50，上半区达到63分额外加35分；没有额外快艇奖励。点击桌上骰子保留或取消保留，点击桌面按钮掷骰或填写计分项。"

