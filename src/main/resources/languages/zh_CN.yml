"rules.color-eight": "Color Eight: 2–5 players, five starting cards, match color or rank. Wild Eight chooses color; Draw One affects every opponent; Skip misses the next player; Reverse changes direction (Skip in two players); Swap trades remaining hands with the next player and retains the active color and rank. You may draw once and then play any legal card or pass. First empty hand wins before resolving its last card effect. No stacking or declaration penalty."
