# Dialog layout; button IDs bind server actions. Edit appearance in plugins/3dtabletop/menus.
Title: '<white>@title@'
Bottom:
  type: multi
  columns: 1
  buttons:
    entry:
      text: '<white>@label@'
      width: 350
      actions: [close]
    resume:
      text: '<yellow>@label@'
      width: 350
      actions: [close]
    rooms:
      text: '<aqua>@label@'
      width: 350
      actions: [close]
    connectfour:
      text: '<white>@label@'
      width: 350
      actions: ['close']
    back:
      text: '<yellow>@label@'
      width: 350
      actions: [close]
    main:
      text: '<yellow>@label@'
      width: 350
      actions: [close]
  exit:
    text: '<dark_gray>[ <red>@label@ <dark_gray>]'
    width: 230
    actions: [close]
