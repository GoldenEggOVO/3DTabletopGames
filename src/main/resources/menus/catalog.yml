# Dialog layout; button IDs bind server actions. Edit appearance in plugins/3dtabletop/menus.
Title: '&f@title@'
Bottom:
  type: multi
  columns: 1
  buttons:
    entry:
      text: '&f@label@'
      width: 350
      actions: [close]
    resume:
      text: '&e@label@'
      width: 350
      actions: [close]
    connectfour:
      text: '&f@label@'
      width: 350
      actions: ['close']
    back:
      text: '&e返回上一页'
      width: 350
      actions: [close]
    main:
      text: '&e返回主菜单'
      width: 350
      actions: [close]
  exit:
    text: '&8[ &c关闭菜单 &8]'
    width: 230
    actions: [close]
