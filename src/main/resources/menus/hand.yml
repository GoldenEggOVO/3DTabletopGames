# Private hand actions are bound to the seated player and room revision.
Title: '<white>@title@'
Body:
  content:
    type: message
    text: '<white>@description@'
    width: 390
Bottom:
  type: multi
  columns: 2
  buttons:
    hand-action:
      text: '<aqua>@label@'
      width: 185
    entry:
      text: '<white>@label@'
      width: 185
    previous:
      text: '<yellow>@label@'
      width: 185
    next:
      text: '<yellow>@label@'
      width: 185
    back:
      text: '<gray>@label@'
      width: 185
  exit:
    text: '<dark_gray>[ <red>@label@ <dark_gray>]'
    width: 230
