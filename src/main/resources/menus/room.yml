# Dialog layout; button IDs bind server actions. Edit appearance in plugins/3dtabletop/menus.
Title: '<white>@title@'
Body:
  content:
    type: message
    text: '<white>@description@'
    width: 370
Bottom:
  type: multi
  columns: 1
  buttons:
    ready:
      text: '<white>@label@'
      width: 330
      actions: [close]
    bots:
      text: '&f补齐陪练并开始'
      width: 330
      actions: [close]
    play:
      text: '&f回到对局'
      width: 330
      actions: [close]
    controls:
      text: '<white>@label@'
      width: 330
      actions: [close]
    entry:
      text: '<white>@label@'
      width: 330
      actions: [close]
    rematch:
      text: '<white>@label@'
      width: 330
      actions: [close]
    options:
      text: '&f房间选项'
      width: 330
      actions: [close]
    back:
      text: '<yellow>@label@'
      width: 330
      actions: [close]
    main:
      text: '<yellow>@label@'
      width: 330
      actions: [close]
  exit:
    text: '<dark_gray>[ <red>@label@ <dark_gray>]'
    width: 230
    actions: [close]
