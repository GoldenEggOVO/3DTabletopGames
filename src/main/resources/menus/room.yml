# Dialog layout; button IDs bind server actions. Edit appearance in plugins/3dtabletop/menus.
Title: '<white>@title@'
Body:
  content:
    type: message
    text: '<white>@description@'
    width: 370
Bottom:
  type: multi
  columns: 1
  buttons:
    ready:
      text: '<green><bold>@label@</bold>'
      width: 330
      actions: [close]
    bots:
      text: '<aqua>@label@'
      width: 330
      actions: [close]
    play:
      text: '<green><bold>@label@</bold>'
      width: 330
      actions: [close]
    entry:
      text: '<white>@label@'
      width: 330
      actions: [close]
    rematch:
      text: '<white>@label@'
      width: 330
      actions: [close]
    options:
      text: '<gray>@label@'
      width: 330
      actions: [close]
    back:
      text: '<yellow>@label@'
      width: 330
      actions: [close]
    main:
      text: '<yellow>@label@'
      width: 330
      actions: [close]
  exit:
    text: '<dark_gray>[ <red>@label@ <dark_gray>]'
    width: 230
    actions: [close]
