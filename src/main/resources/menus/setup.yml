# Game setup; rules are immutable after room creation. Existing custom pages stay intact.
Title: '<white>@title@'
Body:
  content:
    type: message
    text: '<white>@description@'
    width: 370
Bottom:
  type: multi
  columns: 1
  buttons:
    start:
      text: '<green><bold>@label@</bold>'
      width: 330
    mode:
      text: '<aqua>@label@'
      width: 330
    capacity:
      text: '<aqua>@label@'
      width: 330
    board:
      text: '<aqua>@label@'
      width: 330
    rule-profile:
      text: '<aqua>@label@'
      width: 330
    details:
      text: '<yellow>@label@'
      width: 330
    entry:
      text: '<white>@label@'
      width: 330
    back:
      text: '<yellow>@label@'
      width: 330
  exit:
    text: '<dark_gray>[ <red>@label@ <dark_gray>]'
    width: 230
